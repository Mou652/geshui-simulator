name: Notify search engines

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/notify-search.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: read
  actions: read

concurrency:
  group: notify-search-engines
  cancel-in-progress: true

jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Notify IndexNow after Pages deployment
        env:
          SITE_URL: https://geshui.moujc.cn/
          KEY_FILE: 390bb38ec7674351b4e40ea01642a953.txt
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.error import URLError
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen

          site = os.environ['SITE_URL']
          key_location = site + os.environ['KEY_FILE']
          host = urlsplit(site).netloc
          headers = {'User-Agent': 'Mou652-Website-Update/1.0'}

          pages_request = Request(
              'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/pages',
              headers={**headers, 'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'},
          )
          with urlopen(pages_request, timeout=30) as response:
              pages = json.load(response)
          print(json.dumps({name: pages.get(name) for name in ('cname', 'https_enforced', 'https_certificate')}))

          for attempt in range(40):
              builds_request = Request(
                  'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
                  + '/actions/runs?head_sha=' + os.environ['GITHUB_SHA'] + '&per_page=30',
                  headers={**headers, 'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'},
              )
              with urlopen(builds_request, timeout=30) as response:
                  runs = json.load(response)['workflow_runs']
              builds = [run for run in runs if run['name'] == 'pages build and deployment']
              if builds and builds[0]['status'] == 'completed':
                  if builds[0]['conclusion'] != 'success':
                      raise RuntimeError('Pages deployment did not succeed; URLs were not submitted')
                  break
              if attempt == 39:
                  raise RuntimeError('Pages deployment is still pending; URLs were not submitted')
              time.sleep(15)

          # 等待正式站同步本次内容，避免提交旧版本站点地图
          expected_files = {}
          for path in ('sitemap.xml', 'index.html', 'assets/promo/config.js'):
              source = 'https://raw.githubusercontent.com/' + os.environ['GITHUB_REPOSITORY'] + '/' + os.environ['GITHUB_SHA'] + '/docs/' + path
              with urlopen(Request(source, headers=headers), timeout=30) as response:
                  expected_files[path] = response.read()
          for attempt in range(24):
              try:
                  ready = True
                  for path, expected in expected_files.items():
                      with urlopen(Request(site + path, headers=headers), timeout=20) as response:
                          if response.read() != expected:
                              ready = False
                              break
                  if ready:
                      break
              except URLError:
                  pass
              if attempt == 23:
                  raise RuntimeError('Production site has not synced this commit; URLs were not submitted')
              time.sleep(15)

          for attempt in range(10):
              try:
                  with urlopen(Request(key_location, headers=headers), timeout=20) as response:
                      key = response.read().decode('utf-8').strip()
                  break
              except URLError:
                  if attempt == 9:
                      print(json.dumps({'engine': 'IndexNow', 'result': 'not submitted; HTTPS or ownership file not ready'}))
                      with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
                          summary.write('IndexNow was not submitted because HTTPS or the ownership file is not ready.\n')
                      raise SystemExit(0)
                  time.sleep(30)
          assert key + '.txt' == os.environ['KEY_FILE'], 'Ownership file does not match'
          with urlopen(Request(site + 'sitemap.xml', headers=headers), timeout=30) as response:
              sitemap = ET.fromstring(response.read())
          urls = [item.text for item in sitemap.findall('.//{*}loc')]
          assert 0 < len(urls) <= 10000, 'Unexpected sitemap size'
          assert len(urls) == len(set(urls)), 'Duplicate sitemap URLs'
          assert all(urlsplit(url).scheme == 'https' and urlsplit(url).netloc == host for url in urls)

          # 根据推送前后的文件差异筛选规范页面
          before = os.environ.get('GH_BEFORE', '')
          if before and before != '0' * 40:
              comparison = ('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
                            + '/compare/' + before + '...' + os.environ['GITHUB_SHA'] + '?per_page=1')
              with urlopen(Request(comparison, headers=pages_request.headers), timeout=30) as response:
                  changed_files = json.load(response)['files']
              changed_urls = set()
              for item in changed_files:
                  filename = item['filename']
                  if not filename.startswith('docs/') or not filename.endswith('.html') or item['status'] == 'removed':
                      continue
                  path = filename.removeprefix('docs/')
                  if path == 'index.html' or path.endswith('/index.html'):
                      path = path.removesuffix('index.html')
                  changed_urls.add(site + path)
              affected = [url for url in urls if url in changed_urls]
              sitemap_changed = any(item['filename'] == 'docs/sitemap.xml' for item in changed_files)
              if len(changed_files) < 300 and (affected or not sitemap_changed):
                  urls = affected
              if not urls:
                  with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
                      summary.write('No changed URLs from the sitemap. IndexNow was not sent.\n')
                  raise SystemExit(0)

          payload = {'host': host, 'key': key, 'keyLocation': key_location, 'urlList': urls}
          request = Request(
              'https://api.indexnow.org/indexnow',
              data=json.dumps(payload).encode('utf-8'),
              headers={**headers, 'Content-Type': 'application/json; charset=utf-8'},
              method='POST',
          )
          with urlopen(request, timeout=30) as response:
              status = response.status
              response.read()
          assert status in (200, 202), f'Unexpected response: {status}'
          result = 'received' if status == 200 else 'received; key validation pending'
          print(json.dumps({'engine': 'IndexNow', 'http_status': status, 'url_count': len(urls), 'result': result}))
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write(f'IndexNow received {len(urls)} URLs (HTTP {status}). This confirms submission, not indexing or ranking.\n')
          PY
